[project]
name = "oc-worker"
version = "0.1.0"
description = "Office Craft Celery worker"
requires-python = ">=3.11"
dependencies = [
  "oc-shared",
  "oc-core",
  "celery[redis]>=5.4",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oc_worker"]

[tool.uv.sources]
oc-shared = { workspace = true }
oc-core = { workspace = true }
