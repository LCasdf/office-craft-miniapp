[project]
name = "oc-api"
version = "0.1.0"
description = "Office Craft FastAPI application"
requires-python = ">=3.11"
dependencies = [
  "oc-shared",
  "oc-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "celery[redis]>=5.4",
]

[project.scripts]
oc-api = "oc_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oc_api"]

[tool.uv.sources]
oc-shared = { workspace = true }
oc-core = { workspace = true }
