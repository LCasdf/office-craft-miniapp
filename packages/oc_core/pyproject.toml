[project]
name = "oc-core"
version = "0.1.0"
description = "Domain models and services (no FastAPI/Celery imports)"
requires-python = ">=3.11"
dependencies = [
  "oc-shared",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "pydantic-settings>=2.3",
  "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oc_core"]

[tool.uv.sources]
oc-shared = { workspace = true }
