[project]
name = "oc-shared"
version = "0.1.0"
description = "Shared enums, error codes, DTOs for Office Craft"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oc_shared"]
