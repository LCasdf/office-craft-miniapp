[project]
name = "office-craft"
version = "0.1.0"
description = "Office Craft miniapp monorepo (FastAPI + Celery)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "oc-shared",
  "oc-core",
  "oc-api",
  "oc-worker",
  "alembic>=1.13",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.uv.workspace]
members = [
  "packages/oc_shared",
  "packages/oc_core",
  "apps/api",
  "apps/worker",
]

[tool.uv.sources]
oc-shared = { workspace = true }
oc-core = { workspace = true }
oc-api = { workspace = true }
oc-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
pythonpath = ["packages/oc_shared/src", "packages/oc_core/src", "apps/api/src", "apps/worker/src"]
